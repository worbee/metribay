name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: metribay_test
          POSTGRES_USER: metribay
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U metribay -d metribay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: standalone
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, sqlite3, pdo_sqlite, pdo_pgsql, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan test
        env:
          DB_CONNECTION: '${{ matrix.database }}'
          DB_DATABASE: '${{ matrix.database == ''pgsql'' && ''metribay_test'' || '':memory:'' }}'
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: metribay
          DB_PASSWORD: test-only-password
      - run: composer analyse
        if: matrix.database == 'sqlite'
      - run: vendor/bin/pint --test ../src ../tests ../database ../routes ../config app tests
        if: matrix.database == 'sqlite'
      - uses: actions/setup-node@v7
        if: matrix.database == 'sqlite'
        with: {node-version: '24', cache: npm, cache-dependency-path: package-lock.json}
      - run: npm ci && npm test && npm run build && git diff --exit-code -- dist
        working-directory: .
        if: matrix.database == 'sqlite'
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - run: docker build -t metribay:ci .
      - name: Serve the sample portfolio from the image
        run: |
          docker run -d --name metribay -p 8080:8080 -e APP_KEY="$(docker run --rm metribay:ci key)" metribay:ci demo
          for attempt in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/up && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/up
          # The demo signs visitors in and shows its banner on the overview.
          curl -fsSL -c /tmp/demo-cookies -b /tmp/demo-cookies http://127.0.0.1:8080/ | grep -q 'This is a demo with fictional data'
      - if: failure()
        run: docker logs metribay
